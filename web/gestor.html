<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestor · atendimento</title>
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<header class="topo"><span class="marca">atende<b>·</b>leads</span><span class="chip">Gestor</span><button id="sair" type="button" hidden>Sair</button></header>
<main>
  <section id="login" class="estreito">
    <h1>Painel do gestor</h1>
    <form id="form-login" class="cartao">
      <label>Token do gestor <input id="token" type="password" autocomplete="off" required></label>
      <label class="mut"><input id="lembrar" type="checkbox"> Lembrar neste aparelho</label>
      <div class="acoes"><button class="primario" type="submit">Entrar</button></div>
      <p id="erro-login" class="erro" role="alert"></p>
    </form>
  </section>
  <section id="painel" hidden>
    <nav class="abas" role="tablist">
      <button class="aba ativa" data-aba="aovivo">Ao vivo</button>
      <button class="aba" data-aba="hoje">Hoje</button>
      <button class="aba" data-aba="leads">Leads</button>
      <button class="aba" data-aba="cadastros">Cadastros</button>
      <button class="aba" data-aba="exportar">Exportar</button>
    </nav>
    <p id="aviso" class="aviso" role="status"></p>
    <section data-painel="aovivo">
      <h2>Equipe agora</h2><div id="av-equipe" class="grade"></div>
      <h2>Fila</h2><div id="av-fila"></div>
      <h2>Em atendimento</h2><div id="av-atendendo"></div>
    </section>
    <section data-painel="hoje" hidden><div id="hoje"></div></section>
    <section data-painel="leads" hidden>
      <form id="form-filtro" class="linha">
        <label>Status <select id="fl-status"><option value="">todos</option><option>novo</option><option>em_atendimento</option>
          <option>negociando</option><option>retornar</option><option>ganho</option><option>perdido</option><option>invalido</option></select></label>
        <label>Colaborador <select id="fl-colab"><option value="">todos</option></select></label>
        <label>De <input id="fl-de" type="date"></label>
        <label>Até <input id="fl-ate" type="date"></label>
        <button class="primario" type="submit">Filtrar</button>
      </form>
      <div id="leads" class="tabela"></div>
      <div id="ficha" class="cartao" hidden></div>
    </section>
    <section data-painel="cadastros" hidden>
      <p class="mut">Edite e salve. Inválido não grava nada (ids e códigos únicos, horários HH:MM, prazos inteiros ≥ 1).</p>
      <label>Nome do negócio <input id="c-nome"></label>
      <label>URL pública <input id="c-url"></label>
      <label>Equipe (JSON) <textarea id="c-equipe" rows="8"></textarea></label>
      <label>Produtos (JSON) <textarea id="c-produtos" rows="8"></textarea></label>
      <label>FAQ (JSON) <textarea id="c-faq" rows="8"></textarea></label>
      <label>Horários (JSON) <textarea id="c-horarios" rows="5"></textarea></label>
      <label>Prazos (JSON) <textarea id="c-prazos" rows="3"></textarea></label>
      <label>Cérebro (JSON) <textarea id="c-cerebro" rows="3"></textarea></label>
      <div class="acoes"><button id="salvar" class="primario">Salvar cadastros</button></div>
    </section>
    <section data-painel="exportar" hidden>
      <p>Baixe todos os leads em CSV (UTF-8).</p>
      <button id="exportar" class="primario">Baixar leads.csv</button>
    </section>
  </section>
</main>
<script src="/web/comum.js"></script>
<script src="/web/gestor.js"></script>
</body>
</html>
