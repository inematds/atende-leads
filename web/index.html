<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Fale com a gente</title>
<link rel="stylesheet" href="/web/style.css">
</head>
<body class="pagina-chat">
<header class="topo"><span class="marca" id="negocio">Atendimento</span><span class="chip">Chat</span></header>
<section id="entrada" class="estreito entrada">
  <h1>Fale com a gente</h1>
  <p class="mut">Deixe seu WhatsApp para a equipe poder te responder.</p>
  <form id="form-entrada" class="cartao">
    <label>Seu nome <input id="nome" autocomplete="name" maxlength="80"></label>
    <label>WhatsApp com DDD <input id="telefone" inputmode="tel" autocomplete="tel" placeholder="(41) 99999-0000" required></label>
    <div class="acoes"><button class="primario" type="submit">Começar conversa</button></div>
    <p id="erro-entrada" class="erro" role="alert"></p>
  </form>
</section>
<section id="chat" class="chat" hidden>
  <div id="log" class="chat-log" aria-live="polite"></div>
  <form id="form-msg" class="chat-form">
    <input id="texto" autocomplete="off" enterkeyhint="send" placeholder="Escreva sua mensagem" aria-label="Sua mensagem" required>
    <button class="primario" type="submit">Enviar</button>
  </form>
</section>
<script src="/web/comum.js"></script>
<script src="/web/chat.js"></script>
</body>
</html>
